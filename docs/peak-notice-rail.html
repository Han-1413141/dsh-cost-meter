<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#202124;color:#e8eaed;font:14px Arial;display:flex;gap:40px;padding:24px}.sidebar{width:72px;height:280px;background:#17181a;padding:18px 10px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;align-items:center}.item{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#aeb4bf}.bbox{width:40px;height:26px;border:1px solid #3c4043;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#e8eaed}.rail{display:flex;flex-direction:column;align-items:center;gap:4px}.track{position:relative;display:flex;flex-direction:column;width:6px;height:56px;border-radius:999px;overflow:hidden;border:1px solid #3c4043}.seg{flex:1;width:100%}.seg.high{background:#ff9800}.seg.low{background:#8ab4f8}.marker{position:absolute;left:0;top:25%;width:100%;height:2px;background:#202124;box-shadow:0 0 0 1px #5f6368}.label{font-size:10px;font-weight:600;white-space:nowrap;color:#ff9800}.tip{font-size:11px;line-height:1.5;color:#9aa0a6;max-width:220px;align-self:center}</style><div class=sidebar><div class=item>⌂</div><div class=item>◉</div><div class=bbox>3%</div><div class=rail><div class=track><div class="seg high"></div><div class="seg low"></div><div class=marker></div></div><span class=label>峰时</span></div><div class=item>⚙</div></div><div class=tip>收起(rail)态竖向峰谷时段条(与展开态同构):<br>竖轨道上橙(峰)下蓝(平价),两段恒定满色,<br>标记线指向当前时段,下方横排短词「峰时/平价」,<br>倒计时与完整计费提示悬停可见;样式可在设置中切换简洁/经典。</div>
