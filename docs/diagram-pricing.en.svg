<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="title desc">
  <title id="title">dsh-cost-meter billing rules and peak/off-peak pricing</title>
  <desc id="desc">Cost formula, time-of-day tiers (official pure two-tier scheme) and 24-hour peak windows for DeepSeek official pricing.</desc>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .mono { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; }
  </style>

  <text x="40" y="40" font-size="23" font-weight="700" fill="#1f2328">Billing rules &amp; peak/off-peak pricing</text>
  <text x="40" y="64" font-size="13" fill="#57606a">Price units match the official docs — USD / 1M tokens</text>

  <!-- Card 1: formula -->
  <rect x="40" y="96" width="920" height="92" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="62" y="122" font-size="12" font-weight="600" fill="#57606a">Cost per model call</text>
  <text x="62" y="152" font-size="15" font-weight="700" fill="#0969da" class="mono">cost = miss × cacheMiss + output × output + (cacheRead + cacheWrite) × cacheHit</text>
  <text x="62" y="174" font-size="11.5" fill="#57606a">Cache writes have no separate price and are billed at the cache-hit price (legacy official rule); cache reads and writes both count as hits.</text>

  <!-- Card 2: tier gating -->
  <rect x="40" y="212" width="920" height="126" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="62" y="240" font-size="12" font-weight="600" fill="#57606a">Time-of-day tiers (official pure two-tier scheme)</text>
  <text x="62" y="262" font-size="11.5" fill="#57606a">The tier follows the current UTC hour — off-peak rates are half of peak rates; with peak/off-peak disabled, the off-peak tier applies:</text>

  <!-- 24h bar: 0..24h, 35px per hour, x = 90 + hour*35 -->
  <rect x="90" y="282" width="840" height="30" rx="6" fill="#eaeef2"/>
  <!-- peak window 1: hours 1-4 -->
  <rect x="125" y="282" width="105" height="30" rx="6" fill="#4176E6"/>
  <!-- peak window 2: hours 6-10 -->
  <rect x="300" y="282" width="140" height="30" rx="6" fill="#4176E6"/>

  <text x="90" y="332" font-size="11" fill="#57606a" text-anchor="middle">00</text>
  <text x="300" y="332" font-size="11" fill="#57606a" text-anchor="middle">06</text>
  <text x="510" y="332" font-size="11" fill="#57606a" text-anchor="middle">12</text>
  <text x="720" y="332" font-size="11" fill="#57606a" text-anchor="middle">18</text>
  <text x="930" y="332" font-size="11" fill="#57606a" text-anchor="middle">24</text>
  <text x="62" y="332" font-size="11" fill="#57606a">UTC</text>

  <rect x="90" y="348" width="12" height="12" rx="3" fill="#4176E6"/>
  <text x="108" y="359" font-size="11.5" fill="#1f2328">Peak hours 01:00–04:00 &amp; 06:00–10:00 UTC → peak price</text>
  <rect x="470" y="348" width="12" height="12" rx="3" fill="#eaeef2" stroke="#d0d7de"/>
  <text x="488" y="359" font-size="11.5" fill="#1f2328">Other hours → off-peak price</text>

  <!-- Card 3: notes -->
  <rect x="40" y="362" width="920" height="88" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="62" y="388" font-size="12" fill="#1f2328">• The ledger always stores USD — currency &amp; FX rate only affect display (default 1 USD = 7.2 CNY, configurable).</text>
  <text x="62" y="410" font-size="12" fill="#1f2328">• The session badge estimates at the current tier; daily / monthly / cumulative and budget bill exactly at call time.</text>
  <text x="62" y="432" font-size="12" fill="#1f2328">• Budget and over-budget warnings only warn — they never block calls.</text>
</svg>
