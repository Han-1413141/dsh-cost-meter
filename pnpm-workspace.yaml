allowBuilds:
  esbuild: true
# minimumReleaseAgeExclude only applies where this file is read, i.e. dev/CI
# installs inside THIS repo (an end-user `dsh plugin add` verifies against the
# PROFILE directory's workspace config). The standalone runtime dependency zod
# is exact-pinned; DSH-owned modules are peers supplied by the host. Pinning
# avoids version drift but does not bypass the user's minimum-release-age policy.
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.5'
  - '@deepseek-ai/cosmokit@1.8.6'
  - '@deepseek-ai/dsh-home-paths@0.2.1-rc.4'
  - '@deepseek-ai/dsh-brand@0.2.1-rc.4'
  - '@deepseek-ai/dsh-credentials@0.2.1-rc.4'
  - 'esbuild@0.28.2'
