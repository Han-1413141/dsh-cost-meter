name: install-smoke

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Single pin for every job that installs a DSH closure directly: the npm `latest` closure
  # (0.2.0-rc.2). The other two hosts live in their fixtures: test/fixtures/install-host
  # (plugin install smoke, same closure) and test/fixtures/next-host (npm `next`, currently
  # 0.2.1-rc.2; the next-host job exercises it end to end).
  DSH_PIN: 0.2.0-rc.2

jobs:
  billion-context-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install billing adapter and actual upstream releases
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile
          npm install --prefix .tmp-peer-host --no-audit --no-fund --ignore-scripts @deepseek-ai/dsh@0.2.1-rc.3
          mkdir -p .tmp-billion-matrix
          npm pack billion-context@0.1.181 billion-context@0.1.190 billion-context@0.1.197 billion-context@0.1.201 billion-context@0.1.202 billion-context@0.1.204 billion-context@0.1.205 billion-context@0.1.206 billion-context@0.1.208 --ignore-scripts --pack-destination .tmp-billion-matrix
      - name: Verify automatic interface compatibility and actual native/proxy billing
        run: |
          node test/billion-context-compatibility.mjs
          node test/billion-context-peer.mjs
          DSH_TEST_NODE_MODULES="$PWD/.tmp-peer-host/node_modules" node test/billion-context-peer-host.mjs
          node test/billion-null-usage.mjs
          for version in 0.1.181 0.1.190 0.1.197 0.1.201 0.1.202 0.1.204 0.1.205 0.1.206 0.1.208; do
            DSH_TEST_BILLION_PACKAGE="$PWD/.tmp-billion-matrix/billion-context-$version.tgz" node test/billion-context-billing.mjs
            DSH_TEST_BILLION_PACKAGE="$PWD/.tmp-billion-matrix/billion-context-$version.tgz" node test/billion-context-auto.mjs
          done
  context-costs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Load the reported Claude skin version
        uses: actions/checkout@v7
        with:
          repository: Nwflower/dsh-claude-style
          ref: 3f1a5aaf5cb11e64e07020fc08372466652155c8
          path: .tmp/claude-style
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install real host, browser and published context clients
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile
          npm install --prefix .tmp-context-host --no-audit --no-fund @deepseek-ai/dsh@${{ env.DSH_PIN }} react@18.2.0 react-dom@18.2.0 jsdom@28.1.0 playwright-core@1.56.1
          mkdir -p .tmp-context-062 .tmp-context-066 .tmp-context-068
          npm pack dsh-context@0.62.0 --pack-destination .tmp-context-062
          npm pack dsh-context@0.66.0 --pack-destination .tmp-context-066
          npm pack dsh-context@0.68.1 --pack-destination .tmp-context-068
          tar -xzf .tmp-context-062/dsh-context-0.62.0.tgz -C .tmp-context-062
          tar -xzf .tmp-context-066/dsh-context-0.66.0.tgz -C .tmp-context-066
          tar -xzf .tmp-context-068/dsh-context-0.68.1.tgz -C .tmp-context-068
      - name: Verify read-only costs, real peer integration and dialog interaction
        run: |
          export DSH_TEST_NODE_MODULES="$PWD/.tmp-context-host/node_modules"
          export DSH_TEST_UI_MODULES="$DSH_TEST_NODE_MODULES"
          export DSH_CONTEXT_062="$PWD/.tmp-context-062/package/lib/client.js"
          export DSH_CONTEXT_066="$PWD/.tmp-context-066/package/lib/client.js"
          export DSH_CONTEXT_068="$PWD/.tmp-context-068/package/lib/client.js"
          export CM_TEST_BROWSER=/usr/bin/google-chrome
          test -x "$CM_TEST_BROWSER" || (sudo apt-get update && sudo apt-get install -y google-chrome-stable)
          if ! fc-list :lang=zh | grep -q .; then sudo apt-get update && sudo apt-get install -y fonts-noto-cjk; fi
          node test/balance-notice.mjs
          git fetch --depth=1 origin aa41d946c475b9e37ee11362e0e130df816d52b0
          git show aa41d946c475b9e37ee11362e0e130df816d52b0:lib/client.js > .tmp-balance-notice-before.js
          node test/balance-notice-browser.mjs --baseline
          node test/balance-notice-browser.mjs
          node test/display-settings-browser.mjs --text-only-only
          mkdir -p .tmp-billion-matrix
          npm pack dsh-codex-subscription@3.1.2 --ignore-scripts --pack-destination .tmp-billion-matrix
          DSH_TEST_CODEX_PACKAGE="$PWD/.tmp-billion-matrix/dsh-codex-subscription-3.1.2.tgz" node test/codex-subscription-published.mjs
          npm pack dsh-codex-subscription@3.1.4 --ignore-scripts --pack-destination .tmp-billion-matrix
          DSH_TEST_CODEX_PACKAGE="$PWD/.tmp-billion-matrix/dsh-codex-subscription-3.1.4.tgz" node test/codex-subscription-published.mjs
          npm pack dsh-codex-subscription@3.1.6 dsh-codex-subscription@3.1.7 dsh-codex-subscription@3.1.8 dsh-codex-subscription@3.1.9 dsh-codex-subscription@3.2.0 dsh-codex-connect@0.2.0-alpha.10 --ignore-scripts --pack-destination .tmp-billion-matrix
          DSH_TEST_CODEX_PACKAGE="$PWD/.tmp-billion-matrix/dsh-codex-subscription-3.1.6.tgz" node test/codex-subscription-published.mjs
          DSH_TEST_CODEX_PACKAGE="$PWD/.tmp-billion-matrix/dsh-codex-subscription-3.1.7.tgz" node test/codex-subscription-published.mjs
          DSH_TEST_CODEX_PACKAGE="$PWD/.tmp-billion-matrix/dsh-codex-subscription-3.1.8.tgz" node test/codex-subscription-published.mjs
          DSH_TEST_CODEX_PACKAGE="$PWD/.tmp-billion-matrix/dsh-codex-subscription-3.1.9.tgz" node test/codex-subscription-published.mjs
          DSH_TEST_CODEX_PACKAGE="$PWD/.tmp-billion-matrix/dsh-codex-subscription-3.2.0.tgz" node test/codex-subscription-published.mjs
          DSH_TEST_CONNECT_PACKAGE="$PWD/.tmp-billion-matrix/dsh-codex-connect-0.2.0-alpha.10.tgz" node test/codex-connect-published.mjs
          npm pack @eddyskywalker/dsh-chatgpt-subscription@0.29.0 --ignore-scripts --pack-destination .tmp-billion-matrix
          DSH_TEST_CHATGPT_PACKAGE="$PWD/.tmp-billion-matrix/eddyskywalker-dsh-chatgpt-subscription-0.29.0.tgz" node test/chatgpt-subscription-quota.mjs
          mkdir -p .tmp-our-free-model
          npm pack dsh-our-free-model@2.1.0 --ignore-scripts --pack-destination .tmp-our-free-model
          tar -xzf .tmp-our-free-model/dsh-our-free-model-2.1.0.tgz -C .tmp-our-free-model
          DSH_TEST_FREE_MODEL_DIR="$PWD/.tmp-our-free-model/package" node test/our-free-model.mjs
          mkdir -p .tmp-connect-workbuddy-published
          npm pack dsh-connect-workbuddy@4.14.1 --ignore-scripts --pack-destination .tmp-connect-workbuddy-published
          tar -xzf .tmp-connect-workbuddy-published/dsh-connect-workbuddy-4.14.1.tgz -C .tmp-connect-workbuddy-published
          node test/connect-workbuddy-published.mjs
          mkdir -p .tmp-xdpool-published
          npm pack dsh-xdpool@2.4.6 --ignore-scripts --pack-destination .tmp-xdpool-published
          tar -xzf .tmp-xdpool-published/dsh-xdpool-2.4.6.tgz -C .tmp-xdpool-published
          node test/xdpool-published.mjs
          node test/context-costs.mjs --host
          node test/context-costs-client.mjs
          node test/context-costs-lifecycle.mjs
          node test/context-costs-regression-browser.mjs
          node test/context-costs-browser.mjs
          node test/session-list-browser.mjs
          node test/session-costs-browser.mjs
          node test/billing-export-browser.mjs
          node test/query-accounts-browser.mjs
          node test/display-settings-browser.mjs --quick-hide-only
          node test/session-costs-performance-browser.mjs
          node test/statistics-cache.mjs
          node test/statistics-warmup.mjs
          node test/cost-views-browser.mjs
          node test/pricing-theme-browser.mjs
          node test/skin-opacity-browser.mjs
          node test/custom-model-prices.mjs
          node test/price-multiplier.mjs
          node test/billion-context-compatibility-browser.mjs
          node test/cache-write-price-browser.mjs
          node test/model-stats-browser.mjs
          node test/factory-quota-browser.mjs
          node test/codex-quota-browser.mjs
          node test/display-settings-browser.mjs
          node test/quota-placement-browser.mjs
          node test/balance-gateway-browser.mjs
          node test/sidebar-guide-browser.mjs
          node test/peak-alert-browser.mjs
          node test/peak-progress-browser.mjs
          node test/update-notice-skin-browser.mjs
          node test/notice-layer-browser.mjs
          node test/workbuddy-settings-browser.mjs
          node test/peak-style-picker-browser.mjs
          git fetch --depth=1 origin tag v1.8.29
          node test/idle-performance-browser.mjs
      - name: Save context regression browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: context-costs-browser-evidence
          path: |
            .tmp-context-regression-browser/*.png
            .tmp-display-review/*
            .tmp-session-costs-performance-after/*
            .tmp-balance-gateway-browser/*
            .tmp-sidebar-guide-browser/*
            .tmp-balance-notice/*
            .tmp-peak-alert-browser/*
            .tmp-idle-performance/result.json
            .tmp-context-regression-browser/report.json
            .tmp-pricing-theme-browser/*.png
            .tmp-pricing-theme-browser/report.json
            .tmp-skin-opacity-after/*.png
            .tmp-skin-opacity-after/result.json
            .tmp-billion-notice-browser/*.png
            .tmp-billion-notice-browser/report.json
            .tmp-cache-write-price-browser/*.png
            .tmp-cache-write-price-browser/report.json
            .tmp-model-stats-browser/*.png
            .tmp-model-stats-browser/report.json
            .tmp-factory-quota-browser/*.png
            .tmp-factory-quota-browser/report.json
            .tmp-codex-quota-browser/*
            .tmp-session-list-browser/*
            .tmp-peak-progress-preview/
            .tmp-quota-placement/
            .tmp-billing-export-review/
            .tmp-notice-skin/
            .tmp-workbuddy-settings/
            .tmp-notice-layer/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

  sidebar-search-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the current workspace UI runtime
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile
          npm install --prefix .tmp-sidebar-host --no-audit --no-fund --ignore-scripts "@deepseek-ai/dsh-client-ui-workspace@${{ env.DSH_PIN }}" react@18.2.0 react-dom@18.2.0 jsdom@28.1.0
      - name: Verify query recovery and scoped credential editor
        run: |
          export DSH_TEST_NODE_MODULES="$PWD/.tmp-sidebar-host/node_modules"
          node test/sidebar-search-recovery.mjs
          node test/credential-editor-dom.mjs --baseline v1.8.6

  statistics-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the current browser runtimes
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile
          npm install --prefix .tmp-statistics-client --no-audit --no-fund --ignore-scripts "@deepseek-ai/dsh-api-gateway@${{ env.DSH_PIN }}" "@deepseek-ai/dsh-typert-registry@${{ env.DSH_PIN }}" "@deepseek-ai/dsh-client-ui-model-selection@${{ env.DSH_PIN }}" @deepseek-ai/cordis@4.0.4 react@18.2.0 react-dom@18.2.0 jsdom@28.1.0
      - name: Verify statistics mount together, and that the cost dialog keeps its content on refetch
        run: |
          export DSH_TEST_NODE_MODULES="$PWD/.tmp-statistics-client/node_modules"
          node test/statistics-remote-registration.mjs
          node test/host-locale-client.mjs
          node test/openrouter-catalog-client.mjs
          node test/openrouter-picker-client.mjs
          # 闪烁回归要真实驱动组件(jsdom + react),因此放在本作业执行:verify.mjs 所在的
          # 两个作业只装 DSH 包,没有 jsdom —— 那样会在 import 阶段 MODULE_NOT_FOUND。
          node test/statistics-flicker.mjs
      - name: Verify the cost dialog clears the DSH titlebar in a real browser
        # 唯一的弹窗几何护栏。前面任一步失败时 GitHub 会跳过本步,于是「弹窗压住标题栏」
        # 这个用户可见回归拿不到信号;always() 让它独立执行(它自带 Chrome 安装与启动)。
        if: always()
        run: |
          # 弹窗几何只能靠真实排版判定(jsdom 不做布局),用 runner 自带的 Chrome 无头执行。
          # 测试自己拉起浏览器并等页面回报结果(--wait),找不到浏览器即以非零退出。
          test -x /usr/bin/google-chrome || (sudo apt-get update && sudo apt-get install -y google-chrome-stable)
          CM_TEST_BROWSER=/usr/bin/google-chrome node test/statistics-dialog-titlebar.mjs "$PWD/.tmp-statistics-client/node_modules" --wait --timeout=300000

  native-search-rc2:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node: '24.15.0'
            undici: '8.10.2'
          - node: '24'
            undici: '8.11.2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install the current DSH search runtime
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile
          npm install --prefix .tmp-native-search-host --no-audit --no-fund @deepseek-ai/dsh@${{ env.DSH_PIN }} undici@${{ matrix.undici }}
      - name: Verify real services, provider, transport and ledger
        run: |
          export DSH_TEST_NODE_MODULES="$PWD/.tmp-native-search-host/node_modules"
          node test/native-search-host.mjs
          node test/web-request-host.mjs
          node scripts/fetch-search-api-fixture.mjs
          node test/search-api-host.mjs
          node test/native-search-proxy.mjs
          mkdir -p .tmp-native-package
          npm pack --pack-destination .tmp-native-package
          node test/native-search-profile.mjs .tmp-native-package/dsh-cost-meter-*.tgz

  marketplace-git-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install reported DSH host and pnpm
        shell: pwsh
        run: |
          npm install -g pnpm@11.21.0
          New-Item -ItemType Directory -Path .tmp-next-host -Force | Out-Null
          Copy-Item test/fixtures/next-host/package.json .tmp-next-host/package.json
          npm install --prefix .tmp-next-host --no-audit --no-fund
      - name: Install through the Plugin Hub Git URL
        shell: pwsh
        env:
          TEST_REV: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $env:DSH_HOME = Join-Path $env:RUNNER_TEMP 'dsh-cost-meter-git-install'
          node .tmp-next-host/node_modules/@deepseek-ai/dsh/lib/bin.js plugin --profile web add "git+https://github.com/han-1413141/dsh-cost-meter.git#$env:TEST_REV"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $config = node .tmp-next-host/node_modules/@deepseek-ai/dsh/lib/bin.js --profile web --dump-config
          if ($LASTEXITCODE -ne 0 -or -not ($config | Select-String 'name: dsh-cost-meter')) { exit 1 }

  next-host-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the pinned next host (test/fixtures/next-host)
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile
          mkdir -p .tmp-next-host
          cp test/fixtures/next-host/package.json .tmp-next-host/package.json
          npm install --prefix .tmp-next-host --no-audit --no-fund
      - name: Verify compatibility, sessions and RPC on the next host
        run: |
          export DSH_TEST_NODE_MODULES="$PWD/.tmp-next-host/node_modules"
          node test/host-peer-compatibility.mjs
          node test/verify.mjs
          node test/go-quota-host.mjs
          node scripts/fetch-injector-fixture.mjs
          DSH_TEST_INJECTOR_SOURCE="$PWD/.tmp-injector-fixture/index.ts" node test/pi-ai-codex-host.mjs
          node test/market-hot-install.mjs
          node test/codex-compat-http.mjs
          node test/plugin-compatibility-watch.mjs
      - name: Verify next-host context calibration and published peer UI
        run: |
          export DSH_TEST_NODE_MODULES="$PWD/.tmp-next-host/node_modules"
          export DSH_TEST_UI_MODULES="$DSH_TEST_NODE_MODULES"
          export DSH_CONTEXT_068="$PWD/.tmp-context-068/package/lib/client.js"
          export CM_TEST_BROWSER=/usr/bin/google-chrome
          mkdir -p .tmp-context-068
          npm pack dsh-context@0.68.1 --ignore-scripts --pack-destination .tmp-context-068
          tar -xzf .tmp-context-068/dsh-context-0.68.1.tgz -C .tmp-context-068
          mkdir -p .tmp-billion-matrix
          npm pack dsh-codex-subscription@3.1.2 --ignore-scripts --pack-destination .tmp-billion-matrix
          DSH_TEST_CODEX_PACKAGE="$PWD/.tmp-billion-matrix/dsh-codex-subscription-3.1.2.tgz" node test/codex-subscription-published.mjs
          npm pack dsh-codex-subscription@3.1.4 --ignore-scripts --pack-destination .tmp-billion-matrix
          DSH_TEST_CODEX_PACKAGE="$PWD/.tmp-billion-matrix/dsh-codex-subscription-3.1.4.tgz" node test/codex-subscription-published.mjs
          npm pack dsh-codex-subscription@3.1.6 dsh-codex-subscription@3.1.7 dsh-codex-subscription@3.1.8 dsh-codex-subscription@3.1.9 dsh-codex-subscription@3.2.0 dsh-codex-connect@0.2.0-alpha.10 --ignore-scripts --pack-destination .tmp-billion-matrix
          DSH_TEST_CODEX_PACKAGE="$PWD/.tmp-billion-matrix/dsh-codex-subscription-3.1.6.tgz" node test/codex-subscription-published.mjs
          DSH_TEST_CODEX_PACKAGE="$PWD/.tmp-billion-matrix/dsh-codex-subscription-3.1.7.tgz" node test/codex-subscription-published.mjs
          DSH_TEST_CODEX_PACKAGE="$PWD/.tmp-billion-matrix/dsh-codex-subscription-3.1.8.tgz" node test/codex-subscription-published.mjs
          DSH_TEST_CODEX_PACKAGE="$PWD/.tmp-billion-matrix/dsh-codex-subscription-3.1.9.tgz" node test/codex-subscription-published.mjs
          DSH_TEST_CODEX_PACKAGE="$PWD/.tmp-billion-matrix/dsh-codex-subscription-3.2.0.tgz" node test/codex-subscription-published.mjs
          DSH_TEST_CONNECT_PACKAGE="$PWD/.tmp-billion-matrix/dsh-codex-connect-0.2.0-alpha.10.tgz" node test/codex-connect-published.mjs
          node test/context-costs.mjs --host
          node test/context-costs-regression-browser.mjs
          node test/native-search-host.mjs
          node test/web-request-host.mjs
          node scripts/fetch-search-api-fixture.mjs
          node test/search-api-host.mjs
          node test/codex-quota-browser.mjs
      - name: Install the packed plugin and start the real Web host
        run: |
          export DSH_TEST_NODE_MODULES="$PWD/.tmp-next-host/node_modules"
          mkdir -p .tmp-next-package
          npm pack --pack-destination .tmp-next-package
          node test/next-host-install.mjs .tmp-next-package/dsh-cost-meter-*.tgz

  market-hot-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install reported host and pinned RPC packages
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile
          mkdir -p .tmp-market-host
          cp test/fixtures/install-host/package.json .tmp-market-host/package.json
          npm install --prefix .tmp-market-host --ignore-scripts --no-audit --no-fund
      - name: Verify hot installation without restarting the host
        run: |
          export DSH_TEST_NODE_MODULES="$PWD/.tmp-market-host/node_modules"
          node test/market-hot-install.mjs
          node test/go-quota-host.mjs
          node test/pi-ai-codex-host.mjs

  source-host-codecs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The plugin floor is 0.2.0, so the npm closure is an in-range 0.2.x host (env.DSH_PIN, the
      # same pin the rest of this workflow uses); the previous 0.1.x pin is out of range. The
      # upstream commit stays pinned: it carries the create() contract in source checkouts that a
      # package-only smoke test cannot mask (#149).
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 0d1f50007f9bca3f52b06e1c3074fa14d5fb0720
          path: .tmp-typert-upstream
          persist-credentials: false
          sparse-checkout: |
            packages/typert
            packages/api/gateway
      - name: Install test dependencies
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile
          npm install --prefix .tmp-typert-host --no-audit --no-fund @deepseek-ai/dsh@${{ env.DSH_PIN }}
      - name: Validate source host and shipped client codecs
        run: |
          export DSH_TEST_SOURCE_ROOT="$PWD/.tmp-typert-upstream"
          export DSH_TEST_NODE_MODULES="$PWD/.tmp-typert-host/node_modules"
          node test/typert-source-host.mjs

  one-click-install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # Windows leg exercises install.ps1 end-to-end, including its
            # pnpm auto-provisioning (pnpm is deliberately not preinstalled).
            verify-cmd: pwsh -NoProfile -Command "dsh --profile web --dump-config | Select-String dsh-cost-meter"
          - os: ubuntu-latest
            # Linux leg exercises the README installer with the tested commit.
            verify-cmd: dsh --profile web --dump-config | grep dsh-cost-meter
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install DeepSeek Harness
        shell: bash
        # Pin the tested host graph to an in-range 0.2.x host: the fixture installs
        # @deepseek-ai/dsh@0.2.0-rc.2, whose closure pins every @deepseek-ai/dsh-* package
        # exactly, so no overrides are needed. Exercise the real host and install.ps1
        # without skipping any assertions.
        run: |
          mkdir -p .tmp-install-host
          cp test/fixtures/install-host/package.json .tmp-install-host/package.json
          npm install --prefix .tmp-install-host --no-audit --no-fund
          node -e 'require("fs").appendFileSync(process.env.GITHUB_PATH, require("path").resolve(".tmp-install-host/node_modules/.bin") + "\n")'
      - name: Install pnpm (Linux leg only)
        if: runner.os == 'Linux'
        shell: bash
        run: npm install -g pnpm
      - name: One-click install (Linux leg, tested commit)
        if: runner.os == 'Linux'
        shell: bash
        env:
          TEST_REV: ${{ github.sha }}
        run: dsh plugin --profile web add "github:Han-1413141/dsh-cost-meter#$TEST_REV"
      # Both legs install the checked-out commit, including the PR merge commit.
      # A previously published tag must not hide an installation regression.
      - name: One-click install (Windows leg, install.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TEST_REV: ${{ github.sha }}
        run: |
          Write-Host "[install-smoke] install.ps1 rev: $env:TEST_REV"
          pwsh -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Rev $env:TEST_REV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify plugin joined the bundle graph
        shell: bash
        run: ${{ matrix.verify-cmd }}
      # 回归与产物门禁需要工作区依赖(zod / dsh-credentials / dsh-home-paths / esbuild):
      # 本 job 只做安装冒烟、从不装工作区依赖,故回归前按锁文件补装(pnpm v11.21 由
      # install.ps1 在 Windows leg 供给、上一步在 Linux leg 显式安装)。--frozen-lockfile
      # 保证 esbuild 与构建已提交 bundle 的 0.28.2 严格一致,产物比对逐字节可复现。
      - name: Install workspace dependencies
        shell: bash
        run: pnpm install --frozen-lockfile
      # 回归门禁(v1.6.8):CI 此前只验证「能装上」,不验证「算得对」——
      # verify.mjs 回归套件(定价数学/峰谷边界/账本回归/端点白名单)此前完全靠人工执行。
      - name: Run regression suite
        shell: bash
        run: |
          export DSH_TEST_NODE_MODULES="$PWD/.tmp-install-host/node_modules"
          node test/verify.mjs
          node test/market-hot-install.mjs
      # 产物漂移门禁(v1.6.8):lib/client.js 是提交进仓库的压缩产物,无 prepare/prepack
      # 钩子,全靠手工构建后提交,此前实测已发生漂移。此处重新构建并比对,任何未提交
      # 的产物差异都会让 CI 变红,杜绝把过期 bundle 发布出去。
      - name: Check client bundle is in sync with src
        shell: bash
        run: |
          node scripts/build.mjs
          # Compare the whole directory rather than a hand-kept file list: the chunk list lives in
          # scripts/build.mjs, so a new chunk must not be able to escape this gate.
          git diff --exit-code -- lib
          test -z "$(git status --porcelain --untracked-files=all -- lib)"
